services:
  postgres:
    image: postgres:16-alpine
    container_name: naek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: naek
      POSTGRES_PASSWORD: naek
      POSTGRES_DB: naek
    ports:
      - "5432:5432"
    volumes:
      - naek-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naek -d naek"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  naek-postgres-data:
