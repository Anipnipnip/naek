# sqlc configuration — generates type-safe Go code from SQL queries.
# No queries are defined yet (db/queries is empty); this file is scaffolding
# for when repository code starts reading/writing instruments and market_snapshots.
# See https://docs.sqlc.dev/ for schema details.
version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlcgen"
        emit_json_tags: true
        emit_interface: true
